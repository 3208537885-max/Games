<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1015">
  <meta name="description" content="一个持续扩展的独立游戏库。">
  <title>不会文科的小旺柴的游戏厅</title>
  <style>
    :root {
      --ink: #f4f3ee;
      --muted: #a9b0bc;
      --canvas: #0c1015;
      --surface: #131922;
      --surface-raised: #19212c;
      --line: rgba(244, 243, 238, .13);
      --lime: #c8ff5f;
      --cyan: #58d5e8;
      --coral: #ff8072;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      min-width: 320px;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    a { color: inherit; text-decoration: none; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; font-size: 15px; }
    .brand-mark {
      display: grid;
      grid-template-columns: repeat(2, 8px);
      gap: 2px;
      width: 18px;
      height: 18px;
    }
    .brand-mark span { background: var(--lime); }
    .brand-mark span:nth-child(2), .brand-mark span:nth-child(3) { background: var(--cyan); }
    .collection-note { color: var(--muted); font-size: 13px; }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 28px;
      align-items: end;
      padding: 76px 0 48px;
    }
    .eyebrow { margin: 0 0 16px; color: var(--lime); font-size: 12px; font-weight: 800; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(36px, 6vw, 68px); line-height: .98; font-weight: 820; }
    .intro-copy { max-width: 315px; margin: 0 0 5px; color: var(--muted); font-size: 15px; line-height: 1.65; }

    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h2 { margin: 0; font-size: 18px; line-height: 1.25; }
    .count { color: var(--muted); font: 600 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .library { padding-bottom: 76px; }
    .game-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }

    .game-card {
      position: relative;
      display: flex;
      min-height: 410px;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .game-card:hover, .game-card:focus-within { transform: translateY(-4px); border-color: rgba(200, 255, 95, .75); background: var(--surface-raised); }
    .game-card:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
    .game-cover { position: relative; min-height: 244px; overflow: hidden; background: #071310; }
    .game-cover img { display: block; width: 100%; height: 100%; min-height: 244px; object-fit: cover; object-position: center 43%; transform: scale(1.46); transition: transform .35s ease; }
    .game-card:hover .game-cover img, .game-card:focus-within .game-cover img { transform: scale(1.53); }
    .cover-scan { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(7, 19, 16, .02), rgba(12, 16, 21, .55)); }
    .game-content { display: flex; min-height: 164px; flex: 1; flex-direction: column; padding: 18px; }
    .game-meta { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font: 600 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .game-name { margin: 18px 0 8px; font-size: 21px; line-height: 1.05; }
    .game-description { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .play-link { display: inline-flex; align-items: center; gap: 8px; width: fit-content; margin-top: auto; padding-top: 18px; color: var(--lime); font-size: 13px; font-weight: 800; }
    .play-link::after { content: "→"; font-size: 18px; line-height: .8; }

    .placeholder { justify-content: space-between; padding: 20px; background: linear-gradient(135deg, #151c25, #10151c); }
    .placeholder-art { position: relative; height: 210px; overflow: hidden; border: 1px dashed rgba(244, 243, 238, .22); background-image: linear-gradient(rgba(244, 243, 238, .06) 1px, transparent 1px), linear-gradient(90deg, rgba(244, 243, 238, .06) 1px, transparent 1px); background-size: 24px 24px; }
    .placeholder-art::before, .placeholder-art::after { position: absolute; content: ""; width: 72px; height: 72px; border: 10px solid var(--cyan); }
    .placeholder-art::before { top: 43px; left: 31px; border-color: var(--coral); }
    .placeholder-art::after { right: 27px; bottom: 26px; border-color: var(--cyan); }
    .placeholder-label { color: var(--muted); font: 600 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .placeholder h3 { margin: 18px 0 0; font-size: 21px; }

    footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; padding: 23px 0 32px; color: var(--muted); font-size: 12px; }

    @media (max-width: 820px) {
      .shell { width: min(100% - 28px, 620px); }
      .intro { grid-template-columns: 1fr; padding: 54px 0 38px; }
      .intro-copy { max-width: 480px; }
      .game-grid { grid-template-columns: 1fr; }
      .game-card { min-height: 370px; }
      .game-cover { min-height: 235px; }
    }

    @media (max-width: 480px) {
      .topbar { min-height: 62px; }
      .collection-note { display: none; }
      h1 { font-size: 39px; }
      .intro { padding-top: 45px; }
      .game-card { min-height: 355px; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="brand" href="./" aria-label="不会文科的小旺柴的游戏厅首页">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      不会文科的小旺柴的游戏厅
    </a>
    <span class="collection-note">PERSONAL GAME COLLECTION</span>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">SELECT A GAME</p>
        <h1 id="page-title">一间持续扩展的<br>游戏小档案室。</h1>
      </div>
      <p class="intro-copy">每个游戏都有自己的一扇入口。选择一个，直接开始。</p>
    </section>

    <section class="library" aria-labelledby="library-title">
      <div class="section-head">
        <h2 id="library-title">游戏库</h2>
        <span class="count">01 / 03</span>
      </div>

      <div class="game-grid">
        <a class="game-card" href="games/tetra/" aria-label="开始游玩光谱方块">
          <div class="game-cover" aria-hidden="true">
            <img src="assets/tetra-cover.png" alt="" width="1280" height="720">
            <div class="cover-scan"></div>
          </div>
          <div class="game-content">
            <div class="game-meta"><span>ARCADE / 001</span><span>2026</span></div>
            <h3 class="game-name">光谱方块</h3>
            <p class="game-description">带有连击、暂存和节奏反馈的现代俄罗斯方块。</p>
            <span class="play-link">开始游戏</span>
          </div>
        </a>

        <article class="game-card placeholder" aria-label="即将加入的新游戏">
          <div>
            <div class="placeholder-art" aria-hidden="true"></div>
            <p class="placeholder-label">NEXT SLOT / 002</p>
          </div>
          <h3>新的游戏正在归档</h3>
        </article>

        <article class="game-card placeholder" aria-label="即将加入的新游戏">
          <div>
            <div class="placeholder-art" aria-hidden="true"></div>
            <p class="placeholder-label">NEXT SLOT / 003</p>
          </div>
          <h3>下一个入口，留给下一次灵感</h3>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="shell footer-inner">
      <span>不会文科的小旺柴的游戏厅</span>
      <span>BUILT FOR PLAY</span>
    </div>
  </footer>
</body>
</html>
