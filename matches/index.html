<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1015">
  <title>对局记录 · 小游戏大合集</title>
  <style>
    :root{--ink:#f4f3ee;--muted:#a9b0bc;--canvas:#0c1015;--surface:#131922;--line:rgba(244,243,238,.13);--lime:#c8ff5f;--cyan:#58d5e8;--coral:#ff8072}*{box-sizing:border-box}body{min-width:320px;margin:0;color:var(--ink);background:var(--canvas);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif}.app{width:min(930px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:76px;border-bottom:1px solid var(--line)}.brand{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:850}.mark{display:grid;grid-template-columns:repeat(2,8px);gap:2px;width:18px;height:18px}.mark i{background:var(--lime)}.mark i:nth-child(2),.mark i:nth-child(3){background:var(--cyan)}.back{color:var(--muted);font-size:12px}main{padding:58px 0 72px}.intro{display:flex;justify-content:space-between;gap:22px;align-items:end;margin-bottom:28px}.eyebrow{margin:0 0 12px;color:var(--lime);font:700 11px ui-monospace,Consolas,monospace;letter-spacing:.1em}h1{margin:0;font-size:38px;line-height:1}.intro p:last-child{max-width:330px;margin:0;color:var(--muted);font-size:13px;line-height:1.6}.record-list{display:grid;gap:12px}.record{display:grid;grid-template-columns:170px 1fr 1fr;gap:1px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--line)}.record-meta,.player{padding:17px;background:var(--surface)}.record-label{display:block;color:var(--muted);font:700 10px ui-monospace,Consolas,monospace;letter-spacing:.08em}.record-date{display:block;margin-top:9px;color:var(--muted);font-size:12px;line-height:1.5}.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}.name{overflow:hidden;font-size:15px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}.score{font:850 20px ui-monospace,Consolas,monospace}.outcome{display:block;margin-top:5px;font-size:11px}.win{color:var(--lime)}.loss{color:var(--coral)}.draw{color:var(--cyan)}.empty{padding:30px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:13px;line-height:1.6}footer{border-top:1px solid var(--line)}footer .app{display:flex;justify-content:space-between;padding:23px 0 32px;color:var(--muted);font-size:12px}@media(max-width:620px){.app{width:min(100% - 28px,620px)}.topbar{min-height:64px}main{padding:42px 0 56px}.intro{display:block}.intro p:last-child{margin-top:15px}h1{font-size:30px}.record{grid-template-columns:1fr 1fr}.record-meta{grid-column:1/-1;padding:12px 15px}.record-date{display:inline;margin-left:10px}.player{padding:14px}.score{font-size:17px}}
  </style>
</head>
<body>
  <header class="app topbar"><a class="brand" href="../"><span class="mark"><i></i><i></i><i></i><i></i></span>小游戏大合集</a><a class="back" href="../">返回游戏厅</a></header>
  <main class="app"><section class="intro"><div><p class="eyebrow">MULTIPLAYER ARCHIVE</p><h1>对局记录</h1></div><p>双人 2048 限时竞速结束后，双方分数和胜负结果会保存在这里。</p></section><section class="record-list" id="recordList"><div class="empty">正在读取对局记录...</div></section></main>
  <footer><div class="app"><span>MATCH ARCHIVE</span><span>made by 不会文科的小旺柴</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/supabase-client.js"></script>
  <script>
    (()=>{"use strict";const list=document.getElementById("recordList"),client=window.gameAuth&&window.gameAuth.client;function el(name,className,text){const node=document.createElement(name);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}function outcomeText(outcome){return outcome==="win"?"胜利":outcome==="loss"?"惜败":"平局"}function formatDate(value){return new Intl.DateTimeFormat("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(new Date(value))}async function load(){if(!client){list.replaceChildren(el("div","empty","记录服务未加载。"));return}const{data,error}=await client.from("multiplayer_match_results").select("room_id, display_name, score, outcome, finished_at").order("finished_at",{ascending:false}).limit(100);if(error){list.replaceChildren(el("div","empty","请先在 Supabase SQL Editor 运行最新版 supabase-setup.sql。"));return}const groups=new Map();(data||[]).forEach(row=>{const group=groups.get(row.room_id)||[];group.push(row);groups.set(row.room_id,group)});if(!groups.size){list.replaceChildren(el("div","empty","还没有完成的联机对局。第一场 2048 限时竞速结束后会显示在这里。"));return}list.replaceChildren(...[...groups.values()].map(rows=>{const record=el("article","record"),meta=el("div","record-meta"),label=el("span","record-label","2048 限时竞速"),date=el("span","record-date",formatDate(rows[0].finished_at));meta.append(label,date);record.append(meta);rows.slice(0,2).forEach(row=>{const player=el("div","player"),identity=el("div"),name=el("strong","name",row.display_name),outcome=el("span",`outcome ${row.outcome}`,outcomeText(row.outcome)),score=el("strong","score",Number(row.score).toLocaleString("zh-CN"));identity.append(name,outcome);player.append(identity,score);record.append(player)});return record}))}load()})();
  </script>
</body>
</html>
