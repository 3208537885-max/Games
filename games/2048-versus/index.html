<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1015">
  <title>2048 限时竞速 · 小游戏大合集</title>
  <style>
    :root { --ink:#f4f3ee; --muted:#a9b0bc; --canvas:#0c1015; --surface:#131922; --line:rgba(244,243,238,.13); --lime:#c8ff5f; --cyan:#58d5e8; --coral:#ff8072; }
    * { box-sizing:border-box; } body { min-width:320px; margin:0; color:var(--ink); background:var(--canvas); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Microsoft YaHei",sans-serif; }
    button,input { font:inherit; } button { cursor:pointer; } .app { width:min(1120px,calc(100% - 40px)); margin:auto; } .topbar { display:flex; min-height:76px; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); } a { color:inherit; text-decoration:none; }
    .brand { display:inline-flex; gap:10px; align-items:center; font-size:15px; font-weight:800; } .mark { display:grid; grid-template-columns:repeat(2,8px); gap:2px; width:18px; height:18px; } .mark i { background:var(--lime); } .mark i:nth-child(2),.mark i:nth-child(3) { background:var(--cyan); }
    .back { color:var(--muted); font-size:12px; } main { padding:58px 0 74px; } .intro { display:flex; justify-content:space-between; gap:30px; align-items:end; margin-bottom:30px; } .eyebrow { margin:0 0 12px; color:var(--lime); font:700 11px ui-monospace,Consolas,monospace; letter-spacing:.11em; } h1 { margin:0; font-size:40px; line-height:1; } .intro p:last-child { max-width:360px; margin:0; color:var(--muted); font-size:14px; line-height:1.65; }
    .room-panel,.game-panel,.player-panel { border:1px solid var(--line); border-radius:8px; background:var(--surface); } .room-panel { padding:24px; } .room-panel[hidden],.game-layout[hidden] { display:none; } h2 { margin:0; font-size:18px; } .room-copy { margin:10px 0 20px; color:var(--muted); font-size:13px; line-height:1.6; } .room-actions { display:flex; flex-wrap:wrap; gap:10px; } .button { min-height:42px; padding:0 15px; border:1px solid var(--line); border-radius:5px; color:var(--ink); background:transparent; font-weight:750; } .button.primary { border:0; color:#10160e; background:var(--lime); } .button:disabled { cursor:wait; opacity:.55; }
    .join-form { display:grid; grid-template-columns:minmax(0,280px) auto; gap:10px; max-width:470px; } input { min-width:0; height:42px; padding:0 12px; border:1px solid var(--line); border-radius:5px; outline:0; color:var(--ink); background:#0c1015; } input:focus { border-color:var(--lime); } .room-message { min-height:20px; margin:16px 0 0; color:var(--muted); font-size:12px; } .room-message.error { color:var(--coral); }
    .lobby { display:grid; grid-template-columns:1fr 260px; gap:16px; } .share-box { margin-top:17px; } .share-label,.metric-label { color:var(--muted); font:700 10px ui-monospace,Consolas,monospace; letter-spacing:.08em; } .share-row { display:flex; gap:8px; margin-top:8px; } .share-row input { flex:1; } .players { display:grid; gap:8px; margin-top:17px; } .player-row { display:flex; align-items:center; justify-content:space-between; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:5px; color:var(--muted); font-size:13px; } .player-row.ready { color:var(--ink); border-color:rgba(88,213,232,.4); } .host-note { margin:18px 0 0; color:var(--muted); font-size:12px; line-height:1.5; }
    .game-layout { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; } .game-panel { padding:14px; } .game-head { display:flex; justify-content:space-between; gap:14px; align-items:baseline; margin:0 2px 12px; } .state { color:var(--cyan); font:700 11px ui-monospace,Consolas,monospace; } .board { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; aspect-ratio:1; padding:8px; border-radius:6px; background:#202837; touch-action:none; } .cell { border-radius:4px; background:rgba(244,243,238,.07); } .tile { display:grid; place-items:center; border-radius:4px; color:#1a1b18; font-weight:850; font-size:clamp(17px,5vw,31px); } .t2{background:#e8e4d8}.t4{background:#c8ff5f}.t8{background:#58d5e8}.t16{background:#ffc763}.t32,.t64{background:#ff8072}.t128,.t256{background:#9b82ff;color:#fff}.t512,.t1024,.t2048,.thigh{background:#f4f3ee;color:#102026}
    .player-panel { padding:18px; } .timer { margin:9px 0 20px; color:var(--lime); font:850 38px ui-monospace,Consolas,monospace; } .score { display:block; margin-top:7px; font:800 28px ui-monospace,Consolas,monospace; } .opponent { margin-top:20px; padding-top:17px; border-top:1px solid var(--line); } .opponent-name { display:block; margin-top:8px; font-size:15px; font-weight:750; } .controls { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:22px; } .controls button { min-height:38px; border:1px solid var(--line); border-radius:5px; color:var(--ink); background:transparent; font-size:17px; } .controls button:first-child { grid-column:2; } .controls button:nth-child(2) { grid-column:1; grid-row:2; } .controls button:nth-child(3) { grid-column:2; grid-row:2; } .controls button:nth-child(4) { grid-column:3; grid-row:2; }
    .result { margin-top:16px; padding:16px; border:1px solid rgba(200,255,95,.4); border-radius:7px; background:rgba(200,255,95,.06); } .result[hidden] { display:none; } .result strong { display:block; color:var(--lime); font-size:20px; } .result p { margin:7px 0 0; color:var(--muted); font-size:12px; }
    footer { border-top:1px solid var(--line); } footer .app { display:flex; justify-content:space-between; padding:23px 0 32px; color:var(--muted); font-size:12px; }
    @media(max-width:720px){.app{width:min(100% - 28px,560px)}.topbar{min-height:64px}.intro{display:block;margin-bottom:24px}.intro p:last-child{margin-top:15px}h1{font-size:31px}.lobby,.game-layout{grid-template-columns:1fr}.game-layout{gap:12px}.player-panel{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.timer{font-size:31px}.controls{grid-column:1/-1}.result{grid-column:1/-1}.join-form{grid-template-columns:1fr}.share-row{flex-wrap:wrap}.share-row input{min-width:100%}}
  </style>
</head>
<body>
  <header class="app topbar"><a class="brand" href="../../"><span class="mark"><i></i><i></i><i></i><i></i></span>小游戏大合集</a><a class="back" href="../../">返回游戏厅</a></header>
  <main class="app">
    <section class="intro"><div><p class="eyebrow">MULTIPLAYER / 001</p><h1>2048 限时竞速</h1></div><p>房主创建链接后分享给一位朋友。两人就绪后同时开始，在 90 秒内拿到更高分。</p></section>
    <section class="room-panel" id="entryPanel"><h2>创建或加入房间</h2><p class="room-copy">创建房间需要登录，用于管理这场对战；朋友打开分享链接后无需登录，填写一个显示名称即可加入。</p><div class="room-actions"><button class="button primary" id="createRoom" type="button">创建分享房间</button></div><p class="room-copy">收到链接？输入你的显示名称即可进入。</p><form class="join-form" id="joinForm"><input id="guestName" maxlength="24" required placeholder="输入你的显示名称"><button class="button" type="submit">加入房间</button></form><p class="room-message" id="entryMessage"></p></section>
    <section class="room-panel" id="lobbyPanel" hidden><div class="lobby"><div><h2 id="lobbyTitle">等待另一位玩家</h2><p class="room-copy" id="lobbyCopy">将链接分享给朋友。双方进入后，房主可以开始比赛。</p><div class="share-box"><span class="share-label">分享链接</span><div class="share-row"><input id="shareLink" readonly><button class="button" id="copyLink" type="button">复制链接</button></div></div><div class="players" id="playerList"></div><p class="host-note" id="hostNote"></p><button class="button primary" id="startRoom" type="button" hidden>两人就绪，开始比赛</button></div><aside class="player-panel"><span class="metric-label">房间状态</span><strong class="score" id="roomCode">------</strong><p class="room-copy" id="roomStatus">正在连接房间...</p></aside></div></section>
    <section class="game-layout" id="gameLayout" hidden><section class="game-panel"><div class="game-head"><span class="metric-label">NUMBER GRID</span><span class="state" id="gameState">等待开始</span></div><div class="board" id="board" role="application" aria-label="2048 对战棋盘"></div></section><aside class="player-panel"><span class="metric-label">剩余时间</span><strong class="timer" id="timer">01:30</strong><span class="metric-label">你的得分</span><strong class="score" id="score">0</strong><div class="opponent"><span class="metric-label">对手</span><strong class="opponent-name" id="opponentName">等待加入</strong><strong class="score" id="opponentScore">0</strong></div><div class="controls"><button data-move="up" type="button">↑</button><button data-move="left" type="button">←</button><button data-move="down" type="button">↓</button><button data-move="right" type="button">→</button></div><div class="result" id="result" hidden><strong id="resultTitle"></strong><p id="resultCopy"></p></div></aside></section>
  </main>
  <footer><div class="app"><span>MULTI / 001</span><span>made by 不会文科的小旺柴</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-client.js"></script>
  <script>
  (()=>{"use strict";
    const client=window.gameAuth&&window.gameAuth.client, SIZE=4, params=new URLSearchParams(location.search); let roomId=params.get("room"), token=getToken(), room=null, players=[], board=[], score=0, playing=false, ticker=null, channel=null, swipe=null;
    const ui={entry:$("entryPanel"),lobby:$("lobbyPanel"),game:$("gameLayout"),message:$("entryMessage"),guest:$("guestName"),create:$("createRoom"),join:$("joinForm"),share:$("shareLink"),copy:$("copyLink"),list:$("playerList"),title:$("lobbyTitle"),copyText:$("lobbyCopy"),code:$("roomCode"),status:$("roomStatus"),start:$("startRoom"),hostNote:$("hostNote"),board:$("board"),score:$("score"),timer:$("timer"),state:$("gameState"),oppName:$("opponentName"),oppScore:$("opponentScore"),result:$("result"),resultTitle:$("resultTitle"),resultCopy:$("resultCopy")}; function $(id){return document.getElementById(id)}
    function getToken(){const key="versus-2048-token";let value=localStorage.getItem(key);if(!value){value=crypto.randomUUID();localStorage.setItem(key,value)}return value} function error(message){ui.message.textContent=message;ui.message.classList.add("error")} function say(message){ui.message.textContent=message;ui.message.classList.remove("error")}
    async function session(){if(!client)return null;const {data}=await client.auth.getSession();return data.session} async function create(){const active=await session();if(!active){error("创建房间需要先在首页登录。朋友加入房间不需要登录。");return}ui.create.disabled=true;const {data,error:err}=await client.rpc("create_multiplayer_room");ui.create.disabled=false;if(err){error("创建失败：请先在 Supabase 运行最新版 SQL。");return}roomId=data.id;history.replaceState(null,"",`?room=${roomId}`);await enter(active.user.user_metadata.nickname||active.user.user_metadata.username||"房主")} async function enter(defaultName=""){if(!client){error("联机服务未加载。");return}const name=(ui.guest.value.trim()||defaultName).slice(0,24);if(!name){error("请填写显示名称。");return}const {data,error:err}=await client.rpc("join_multiplayer_room",{p_room_id:roomId,p_player_token:token,p_display_name:name});if(err){error(err.message.includes("full")?"这个房间已经有两位玩家了。":"无法加入房间，链接可能已失效。");return}ui.entry.hidden=true;ui.lobby.hidden=false;ui.share.value=location.href;await refresh();listen()} async function refresh(){if(!roomId||!client)return;const [{data:roomData,error:roomError},{data:playerData}]=await Promise.all([client.from("multiplayer_rooms").select("*").eq("id",roomId).maybeSingle(),client.from("multiplayer_players").select("*").eq("room_id",roomId).order("updated_at")]);if(roomError||!roomData){error("房间不存在或已被关闭。");return}room=roomData;players=playerData||[];renderLobby();if(room.status==="live"){ui.game.hidden=false;beginClock();}}
    function renderLobby(){const mine=players.find(p=>p.player_token===token), isHost=mine&&room.host_id===mine.user_id;ui.code.textContent=room.room_code;ui.list.replaceChildren(...[0,1].map(i=>{const p=players[i],row=document.createElement("div");row.className=`player-row${p?" ready":""}`;row.innerHTML=p?`<span>${escapeHtml(p.display_name)}${p.player_token===token?"（你）":""}</span><span>已加入</span>`:"<span>等待玩家加入</span><span>--</span>";return row}));ui.start.hidden=!(isHost&&players.length===2&&room.status==="waiting");ui.hostNote.textContent=isHost?players.length<2?"等待朋友通过链接进入。":"两人已就绪，由你开始比赛。":"等待房主开始比赛。";ui.status.textContent=room.status==="waiting"?`${players.length}/2 位玩家就绪`:room.status==="live"?"比赛进行中":"比赛已结束";}
    async function start(){ui.start.disabled=true;const {error:err}=await client.rpc("start_multiplayer_room",{p_room_id:roomId});ui.start.disabled=false;if(err)ui.hostNote.textContent="无法开始，请确认两位玩家都在房间内。";else await refresh()} function listen(){if(channel||!client)return;channel=client.channel(`versus-${roomId}`).on("postgres_changes",{event:"*",schema:"public",table:"multiplayer_rooms",filter:`id=eq.${roomId}`},()=>refresh()).on("postgres_changes",{event:"*",schema:"public",table:"multiplayer_players",filter:`room_id=eq.${roomId}`},()=>refresh()).subscribe();}
    function empty(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0))} function spawn(){const open=[];board.forEach((row,r)=>row.forEach((v,c)=>{if(!v)open.push([r,c])}));if(!open.length)return;const [r,c]=open[Math.floor(Math.random()*open.length)];board[r][c]=Math.random()<.9?2:4} function startGame(){board=empty();score=0;spawn();spawn();playing=true;renderBoard()} function line(direction,n){return direction==="left"?[n,0,0,1]:direction==="right"?[n,3,0,-1]:direction==="up"?[0,n,1,0]:[3,n,-1,0]} function move(direction){if(!playing)return;let changed=false,gained=0,next=empty();for(let n=0;n<SIZE;n++){let values=[];for(let p=0;p<SIZE;p++){let[r,c,dr,dc]=line(direction,n);r+=dr*p;c+=dc*p;if(board[r][c])values.push(board[r][c])}let merged=[];for(let i=0;i<values.length;i++){if(values[i]===values[i+1]){let v=values[i]*2;merged.push(v);gained+=v;i++}else merged.push(values[i])}for(let p=0;p<merged.length;p++){let[r,c,dr,dc]=line(direction,n);r+=dr*p;c+=dc*p;next[r][c]=merged[p]}}changed=next.some((row,r)=>row.some((v,c)=>v!==board[r][c]));if(!changed)return;if((board=next,score+=gained,spawn(),renderBoard(),isOver()))finish(true);else report(false)} function isOver(){return board.every((row,r)=>row.every((v,c)=>v&&(r===3||board[r+1][c]!==v)&&(c===3||row[c+1]!==v)))} function cls(v){return v>2048?"thigh":`t${v}`} function renderBoard(){ui.board.replaceChildren();board.forEach(row=>row.forEach(v=>{let el=document.createElement("div");el.className=v?`tile ${cls(v)}`:"cell";el.textContent=v||"";ui.board.append(el)}));ui.score.textContent=score.toLocaleString("zh-CN")} async function report(finished){if(!client||!roomId)return;await client.rpc("report_multiplayer_score",{p_room_id:roomId,p_player_token:token,p_score:score,p_finished:finished})}
    function beginClock(){ui.lobby.hidden=true;ui.game.hidden=false;if(!ticker) ticker=setInterval(tick,250);tick()} function tick(){if(!room||!room.ends_at)return;const starts=new Date(room.starts_at).getTime(), ends=new Date(room.ends_at).getTime(), now=Date.now();if(now<starts){ui.state.textContent=`倒计时 ${Math.ceil((starts-now)/1000)}`;return}if(!playing&&now>=starts)startGame();const left=Math.max(0,ends-now);ui.timer.textContent=`${String(Math.floor(left/60000)).padStart(2,"0")}:${String(Math.ceil(left%60000/1000)).padStart(2,"0")}`;const rival=players.find(p=>p.player_token!==token);ui.oppName.textContent=rival?rival.display_name:"等待加入";ui.oppScore.textContent=(rival?.score||0).toLocaleString("zh-CN");if(left<=0&&playing)finish(false)} function finish(early){if(!playing)return;playing=false;report(true);const rival=players.find(p=>p.player_token!==token), other=rival?.score||0;ui.state.textContent="本局结束";ui.result.hidden=false;ui.resultTitle.textContent=early?"棋盘已满":"时间到";ui.resultCopy.textContent=`你的 ${score.toLocaleString("zh-CN")} 分，对手当前 ${other.toLocaleString("zh-CN")} 分。`}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))} ui.create.addEventListener("click",create);ui.join.addEventListener("submit",e=>{e.preventDefault();if(roomId)enter()});ui.start.addEventListener("click",start);ui.copy.addEventListener("click",async()=>{await navigator.clipboard.writeText(ui.share.value);ui.copy.textContent="已复制";setTimeout(()=>ui.copy.textContent="复制链接",1500)});document.querySelectorAll("[data-move]").forEach(b=>b.addEventListener("click",()=>move(b.dataset.move)));document.addEventListener("keydown",e=>{const m={arrowleft:"left",a:"left",arrowright:"right",d:"right",arrowup:"up",w:"up",arrowdown:"down",s:"down"}[e.key.toLowerCase()];if(m){e.preventDefault();move(m)}});ui.board.addEventListener("pointerdown",e=>{swipe={x:e.clientX,y:e.clientY}});ui.board.addEventListener("pointerup",e=>{if(!swipe)return;const dx=e.clientX-swipe.x,dy=e.clientY-swipe.y;swipe=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up")});if(roomId){ui.entry.querySelector("h2").textContent="加入对战房间";ui.entry.querySelector(".room-copy").textContent="输入显示名称后加入。无需登录。"}else ui.join.hidden=true;
  })();
  </script>
</body>
</html>
