  <header class="app topbar"><a class="brand" href="../../"><span class="mark"><i></i><i></i><i></i><i></i></span>小游戏大合集</a><span><a class="back" href="../../matches/">对局记录</a>　<a class="back" href="../../">返回游戏厅</a></span></header>
  <main class="app"><section class="intro"><div><p class="eyebrow">MULTIPLAYER / 001</p><h1>2048 限时竞速</h1></div><p class="intro-copy">房主创建链接后分享给一位朋友。两人就绪后同时开始，在 90 秒内拿到更高分。</p></section>
    <section class="room-panel" id="entryPanel"><h2>创建或加入房间</h2><p class="room-copy">创建房间需要登录。朋友打开链接后无需登录，填写显示名称即可加入。</p><button class="button primary" id="createRoom" type="button">创建分享房间</button><p class="room-copy">收到链接？输入显示名称后加入。</p><form class="join-form" id="joinForm"><input id="guestName" maxlength="24" required placeholder="输入你的显示名称"><button class="button" type="submit">加入房间</button></form><p class="message" id="entryMessage"></p></section>
    <section class="room-panel" id="lobbyPanel" hidden><div class="lobby"><div><h2>等待另一位玩家</h2><p class="room-copy">将链接分享给朋友。双方进入后，房主可以开始比赛。</p><div class="share-box"><span class="share-label">分享链接</span><div class="share-row"><input id="shareLink" readonly><button class="button" id="copyLink" type="button">复制链接</button></div></div><div class="players" id="playerList"></div><p class="host-note" id="hostNote"></p><button class="button primary" id="startRoom" type="button" hidden>两人就绪，开始比赛</button></div><aside class="lobby-status"><span class="metric-label">房间状态</span><strong class="room-code" id="roomCode">------</strong><p class="room-copy" id="roomStatus">正在连接房间...</p></aside></div></section>
    <section class="match" id="match" hidden><div class="scoreboard"><div class="score-slot"><span class="metric-label">我的得分</span><strong class="score-name" id="myName">我</strong><strong class="score-value" id="myScore">0</strong></div><div class="clock-slot"><span class="metric-label">剩余时间</span><strong class="clock" id="timer">01:30</strong></div><div class="score-slot right"><span class="metric-label">对手得分</span><strong class="score-name" id="opponentName">等待加入</strong><strong class="score-value" id="opponentScore">0</strong></div></div><div class="boards"><section class="board-panel"><div class="board-head"><span class="metric-label">我的 2048</span><span class="board-state" id="gameState">等待开始</span></div><div class="board" id="myBoard" role="application" aria-label="我的 2048 棋盘"></div><div class="controls"><button data-direction="up" type="button">↑</button><button data-direction="left" type="button">←</button><button data-direction="down" type="button">↓</button><button data-direction="right" type="button">→</button></div></section><section class="board-panel"><div class="board-head"><span class="metric-label">对手 2048</span><span class="board-state">实时同步</span></div><div class="board opponent-board" id="opponentBoard" aria-label="对手 2048 棋盘"></div></section></div><div class="result" id="result" hidden><strong id="resultTitle"></strong><p id="resultCopy"></p></div></section>
  </main><footer><div class="app"><span>MULTI / 001</span><span>made by 不会文科的小旺柴</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../assets/supabase-client.js"></script>
  <script>
    (() => { "use strict";
      const SIZE=4,client=window.gameAuth&&window.gameAuth.client,params=new URLSearchParams(location.search);let roomId=params.get("room"),room=null,players=[],matchResults=[],board=emptyBoard(),score=0,playing=false,hasStarted=false,matchFinalized=false,lastAnimation={moves:[],born:[]},timerId=null,pollId=null,channel=null,swipeStart=null;
      const token=playerToken(),ui={entry:el("entryPanel"),lobby:el("lobbyPanel"),match:el("match"),create:el("createRoom"),join:el("joinForm"),guest:el("guestName"),message:el("entryMessage"),share:el("shareLink"),copy:el("copyLink"),playerList:el("playerList"),hostNote:el("hostNote"),start:el("startRoom"),roomCode:el("roomCode"),roomStatus:el("roomStatus"),myBoard:el("myBoard"),opponentBoard:el("opponentBoard"),gameState:el("gameState"),myName:el("myName"),myScore:el("myScore"),opponentName:el("opponentName"),opponentScore:el("opponentScore"),timer:el("timer"),result:el("result"),resultTitle:el("resultTitle"),resultCopy:el("resultCopy")};
      function el(id){return document.getElementById(id)}function playerToken(){const key="versus-2048-token";let value=localStorage.getItem(key);if(!value){value=crypto.randomUUID();localStorage.setItem(key,value)}return value}function message(text,bad=false){ui.message.textContent=text;ui.message.classList.toggle("error",bad)}function emptyBoard(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0))}function mine(){return players.find(p=>p.player_token===token)}function rival(){return players.find(p=>p.player_token!==token)}
      async function currentSession(){if(!client)return null;const{data}=await client.auth.getSession();return data.session}async function createRoom(){const session=await currentSession();if(!session){message("创建房间需要先在首页登录。朋友加入房间不需要登录。",true);return}ui.create.disabled=true;const{data,error}=await client.rpc("create_multiplayer_room");ui.create.disabled=false;if(error){message("创建失败：请确认已在 Supabase SQL Editor 运行最新版 SQL。",true);return}roomId=data.id;history.replaceState(null,"",`?room=${roomId}`);await joinRoom(session.user.user_metadata.nickname||session.user.user_metadata.username||"房主")}async function joinRoom(defaultName=""){if(!client){message("联机服务未加载。",true);return}const name=(ui.guest.value.trim()||defaultName).slice(0,24);if(!name){message("请填写显示名称。",true);return}const{error}=await client.rpc("join_multiplayer_room",{p_room_id:roomId,p_player_token:token,p_display_name:name});if(error){message(error.message.includes("full")?"这个房间已经有两位玩家了。":"无法加入房间，链接可能已失效。",true);return}ui.entry.hidden=true;ui.lobby.hidden=false;ui.share.value=location.href;await refreshRoom();listen();if(!pollId)pollId=window.setInterval(refreshRoom,1500)}
      async function refreshRoom(){if(!client||!roomId)return;const[{data:roomData,error:roomError},{data:playerData},{data:resultData}]=await Promise.all([client.from("multiplayer_rooms").select("*").eq("id",roomId).maybeSingle(),client.from("multiplayer_players").select("*").eq("room_id",roomId).order("updated_at"),client.from("multiplayer_match_results").select("*").eq("room_id",roomId)]);if(roomError||!roomData){message("房间不存在或已失效。",true);return}room=roomData;players=playerData||[];matchResults=resultData||[];renderLobby();renderMatch();if(room.status==="live")beginMatch();if(room.status==="finished"){ui.lobby.hidden=true;ui.match.hidden=false;showRecordedResult()}}function renderLobby(){const me=mine(),isHost=me&&me.user_id===room.host_id;ui.roomCode.textContent=room.room_code;ui.playerList.replaceChildren(...[0,1].map(i=>{const p=players[i],row=document.createElement("div");row.className=`player-row${p?" ready":""}`;row.textContent=p?`${p.display_name}${p.player_token===token?"（你）":""} · 已加入`:"等待玩家加入";return row}));ui.start.hidden=!(isHost&&players.length===2&&room.status==="waiting");ui.hostNote.textContent=isHost?(players.length===2?"两人已就绪，由你开始比赛。":"等待朋友通过分享链接进入。 "):"等待房主开始比赛。";ui.roomStatus.textContent=room.status==="waiting"?`${players.length}/2 位玩家就绪`:room.status==="live"?"比赛进行中":"比赛已结束"}function renderMatch(){const me=mine(),other=rival();ui.myName.textContent=me?`${me.display_name}（你）`:"我";ui.opponentName.textContent=other?other.display_name:"等待加入";ui.opponentScore.textContent=Number(other&&other.score||0).toLocaleString("zh-CN");renderOpponent(other&&other.board_state,other&&other.animation_state)}async function startRoom(){ui.start.disabled=true;const{error}=await client.rpc("start_multiplayer_room",{p_room_id:roomId});ui.start.disabled=false;if(error)ui.hostNote.textContent="无法开始，请确认两位玩家都在房间内。"}function listen(){if(channel||!client)return;channel=client.channel(`versus-${roomId}`).on("postgres_changes",{event:"*",schema:"public",table:"multiplayer_rooms",filter:`id=eq.${roomId}`},refreshRoom).on("postgres_changes",{event:"*",schema:"public",table:"multiplayer_players",filter:`room_id=eq.${roomId}`},refreshRoom).subscribe()}
      function beginMatch(){ui.lobby.hidden=true;ui.match.hidden=false;if(!timerId)timerId=setInterval(updateClock,200);updateClock()}function updateClock(){if(!room||!room.ends_at)return;const now=Date.now(),starts=new Date(room.starts_at).getTime(),ends=new Date(room.ends_at).getTime();if(now<starts){ui.gameState.textContent=`倒计时 ${Math.ceil((starts-now)/1000)}`;return}if(!hasStarted)startGame();const remain=Math.max(0,ends-now);ui.timer.textContent=`${String(Math.floor(remain/60000)).padStart(2,"0")}:${String(Math.ceil(remain%60000/1000)).padStart(2,"0")}`;if(remain<=0&&!matchFinalized)void finalizeMatch()}function spawnTile(){const open=[];board.forEach((row,r)=>row.forEach((v,c)=>{if(!v)open.push([r,c])}));if(!open.length)return null;const[row,col]=open[Math.floor(Math.random()*open.length)];board[row][col]=Math.random()<.9?2:4;return{row,col}}function startGame(){board=emptyBoard();score=0;playing=true;hasStarted=true;ui.result.hidden=true;const born=[spawnTile(),spawnTile()].filter(Boolean);lastAnimation={moves:[],born};renderMy([],born);void report(false)}
      function coordinateFor(direction,line,position){if(direction==="left")return{row:line,col:position};if(direction==="right")return{row:line,col:SIZE-1-position};if(direction==="up")return{row:position,col:line};return{row:SIZE-1-position,col:line}}function cellDistance(from,to){return Math.abs(from.row-to.row)+Math.abs(from.col-to.col)}function motionType(from,to){if(to.col<from.col)return"left";if(to.col>from.col)return"right";if(to.row<from.row)return"up";if(to.row>from.row)return"down";return"still"}function calculateMove(direction){const next=emptyBoard(),animations=[];let gained=0;for(let line=0;line<SIZE;line+=1){const sources=[];for(let position=0;position<SIZE;position+=1){const point=coordinateFor(direction,line,position),value=board[point.row][point.col];if(value)sources.push({...point,value})}let target=0;for(let index=0;index<sources.length;index+=1){const first=sources[index],second=sources[index+1],origins=[first];let value=first.value,merged=false;if(second&&second.value===first.value){value*=2;gained+=value;merged=true;origins.push(second);index+=1}const to=coordinateFor(direction,line,target),from=origins.reduce((far,origin)=>cellDistance(origin,to)>cellDistance(far,to)?origin:far),distance=cellDistance(from,to);next[to.row][to.col]=value;animations.push({row:to.row,col:to.col,from,motion:motionType(from,to),distance,merged});target+=1}}const moved=next.some((row,r)=>row.some((v,c)=>v!==board[r][c]));return{next,animations,gained,moved}}function move(direction){if(!playing)return;const result=calculateMove(direction);if(!result.moved){if(isGameOver())finishGame(true);return}board=result.next;score+=result.gained;const born=spawnTile();lastAnimation={moves:result.animations,born:born?[born]:[]};renderMy(result.animations,lastAnimation.born);void report(false);if(isGameOver())finishGame(true)}function isGameOver(){for(let r=0;r<SIZE;r+=1)for(let c=0;c<SIZE;c+=1){if(!board[r][c])return false;if(c<SIZE-1&&board[r][c]===board[r][c+1])return false;if(r<SIZE-1&&board[r][c]===board[r+1][c])return false}return true}function tileClass(value){return value<=2048?`tile-${value}`:"tile-high"}function tileStep(target=ui.myBoard){const style=getComputedStyle(target),gap=parseFloat(style.columnGap)||0,padding=(parseFloat(style.paddingLeft)||0)+(parseFloat(style.paddingRight)||0);return(target.clientWidth-padding-gap*(SIZE-1))/SIZE+gap}
      function renderMy(animations=[],born=[]){const animationMap=new Map(animations.map(item=>[`${item.row}:${item.col}`,item])),newSet=new Set(born.map(item=>`${item.row}:${item.col}`)),step=tileStep(),longest=animations.reduce((max,item)=>Math.max(max,item.distance),0),delay=longest?90+longest*30:0;ui.myBoard.replaceChildren();board.forEach((row,r)=>row.forEach((value,c)=>{const cell=document.createElement("div");cell.className="cell";if(value){const tile=document.createElement("span"),key=`${r}:${c}`,animation=animationMap.get(key),motion=newSet.has(key)?"new":animation?animation.motion:"still",distance=animation?animation.distance:0;tile.className=`tile ${tileClass(value)}`;tile.dataset.motion=motion;tile.textContent=String(value);tile.style.setProperty("--motion-duration",`${105+distance*38}ms`);tile.style.setProperty("--arrival-scale",animation&&animation.merged?"1.1":"1.025");if(animation){tile.style.setProperty("--from-x",`${(animation.from.col-c)*step}px`);tile.style.setProperty("--from-y",`${(animation.from.row-r)*step}px`)}if(motion==="new")tile.style.setProperty("--spawn-delay",`${delay}ms`);cell.append(tile)}ui.myBoard.append(cell)}));ui.myScore.textContent=score.toLocaleString("zh-CN");if(playing)ui.gameState.textContent="进行中"}function renderOpponent(data,state={}){const remote=Array.isArray(data)&&data.length===SIZE?data:emptyBoard(),animations=Array.isArray(state.moves)?state.moves:[],born=Array.isArray(state.born)?state.born:[],animationMap=new Map(animations.map(item=>[`${item.row}:${item.col}`,item])),newSet=new Set(born.map(item=>`${item.row}:${item.col}`)),step=tileStep(ui.opponentBoard),longest=animations.reduce((max,item)=>Math.max(max,item.distance||0),0),delay=longest?90+longest*30:0;ui.opponentBoard.replaceChildren();remote.forEach((row,r)=>row.forEach((value,c)=>{const cell=document.createElement("div");cell.className="cell";if(Number(value)){const tile=document.createElement("span"),key=`${r}:${c}`,animation=animationMap.get(key),motion=newSet.has(key)?"new":animation?animation.motion:"still",distance=animation?animation.distance:0;tile.className=`tile ${tileClass(Number(value))}`;tile.dataset.motion=motion;tile.textContent=String(value);tile.style.setProperty("--motion-duration",`${105+distance*38}ms`);tile.style.setProperty("--arrival-scale",animation&&animation.merged?"1.1":"1.025");if(animation){tile.style.setProperty("--from-x",`${(animation.from.col-c)*step}px`);tile.style.setProperty("--from-y",`${(animation.from.row-r)*step}px`)}if(motion==="new")tile.style.setProperty("--spawn-delay",`${delay}ms`);cell.append(tile)}ui.opponentBoard.append(cell)}))}async function report(done){if(!client||!roomId)return;const{error}=await client.rpc("report_multiplayer_score",{p_room_id:roomId,p_player_token:token,p_score:score,p_board_state:board,p_animation_state:lastAnimation,p_finished:done});if(error)console.warn("Match sync failed:",error.message)}function finishGame(full){if(!playing)return;playing=false;ui.gameState.textContent="棋盘已满";void report(true);ui.result.hidden=false;ui.resultTitle.textContent="棋盘已满";ui.resultCopy.textContent="本局得分已锁定，等待倒计时结束后统一结算。"}async function finalizeMatch(){if(matchFinalized)return;matchFinalized=true;playing=false;ui.gameState.textContent="正在结算";await report(true);await new Promise(resolve=>setTimeout(resolve,350));const{data,error}=await client.rpc("finish_multiplayer_room",{p_room_id:roomId,p_player_token:token});if(error){ui.result.hidden=false;ui.resultTitle.textContent="时间到";ui.resultCopy.textContent="成绩正在同步，请稍后刷新查看结果。";console.warn("Match finish failed:",error.message);return}matchResults=data||[];showRecordedResult()}function showRecordedResult(){const result=matchResults.find(item=>item.player_token===token);if(!result)return;matchFinalized=true;playing=false;ui.timer.textContent="00:00";ui.gameState.textContent="对局结束";ui.result.hidden=false;ui.resultTitle.textContent=result.outcome==="win"?"胜利":result.outcome==="loss"?"惜败":"平局";ui.resultCopy.textContent=`最终得分 ${Number(result.score).toLocaleString("zh-CN")}。本场对局已保存到对局记录。`}
      ui.create.addEventListener("click",createRoom);ui.join.addEventListener("submit",event=>{event.preventDefault();if(roomId)joinRoom()});ui.start.addEventListener("click",startRoom);ui.copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(ui.share.value);ui.copy.textContent="已复制";setTimeout(()=>ui.copy.textContent="复制链接",1400)}catch(_){ui.share.select();document.execCommand("copy")}});document.querySelectorAll("[data-direction]").forEach(button=>button.addEventListener("click",()=>move(button.dataset.direction)));document.addEventListener("keydown",event=>{const direction={arrowleft:"left",a:"left",arrowright:"right",d:"right",arrowup:"up",w:"up",arrowdown:"down",s:"down"}[event.key.toLowerCase()];if(direction){event.preventDefault();move(direction)}});ui.myBoard.addEventListener("pointerdown",event=>{if(event.pointerType!=="mouse"){swipeStart={x:event.clientX,y:event.clientY};ui.myBoard.setPointerCapture(event.pointerId)}});ui.myBoard.addEventListener("pointerup",event=>{if(!swipeStart)return;const dx=event.clientX-swipeStart.x,dy=event.clientY-swipeStart.y;swipeStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?dx>0?"right":"left":dy>0?"down":"up")});if(roomId){ui.entry.querySelector("h2").textContent="加入对战房间";ui.entry.querySelector(".room-copy").textContent="输入显示名称后加入。无需登录。"}else ui.join.hidden=true;renderMy();renderOpponent();
