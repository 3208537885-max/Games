<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1a1d">
  <title>贪吃蛇 · 小游戏大合集</title>
  <style>
    :root {
      --ink: #f4f3ee;
      --muted: #a9b0bc;
      --canvas: #0d171a;
      --surface: #142226;
      --line: rgba(244, 243, 238, .14);
      --lime: #c8ff5f;
      --cyan: #58d5e8;
      --coral: #ff8072;
      --amber: #ffc763;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, a { font: inherit; }
    button { touch-action: manipulation; }
    a { color: inherit; text-decoration: none; }
    .app { width: min(1050px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 76px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 800; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 8px); gap: 2px; width: 18px; height: 18px; }
    .brand-mark span { background: var(--lime); }
    .brand-mark span:nth-child(2), .brand-mark span:nth-child(3) { background: var(--cyan); }
    .top-actions { display: flex; align-items: center; gap: 15px; }
    .status { color: var(--muted); font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .1em; }
    .back-link { color: var(--muted); font-size: 12px; }
    .back-link::before { content: "←"; margin-right: 7px; color: var(--lime); font-size: 16px; }
    main { padding: 58px 0 76px; }
    .intro { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 12px; color: var(--lime); font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; }
    h1 { margin: 0; font-size: 42px; line-height: 1; }
    .intro-copy { max-width: 280px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .game-layout { display: grid; grid-template-columns: minmax(0, 520px) minmax(230px, 1fr); align-items: start; gap: 22px; }
    .board-panel, .info-card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .board-panel { padding: 16px; }
    .board-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .board-label { color: var(--muted); font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; }
    .board-state { color: var(--lime); font-size: 12px; font-weight: 800; }
    .canvas-wrap { position: relative; aspect-ratio: 1; overflow: hidden; border: 1px solid rgba(88, 213, 232, .2); border-radius: 7px; background: #071315; touch-action: none; }
    #gameCanvas { display: block; width: 100%; height: 100%; }
    .board-overlay { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; background: rgba(7, 19, 21, .82); backdrop-filter: blur(5px); }
    .board-overlay[hidden] { display: none; }
    .overlay-card { width: min(100%, 300px); text-align: center; }
    .overlay-card h2 { margin: 0; font-size: 28px; }
    .overlay-card p { margin: 10px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .primary-button, .direction-button { border: 0; color: #15200c; background: var(--lime); font-weight: 900; cursor: pointer; }
    .primary-button { min-height: 43px; width: 100%; border-radius: 5px; font-size: 13px; }
    .primary-button:hover { filter: brightness(1.08); }
    .side-stack { display: grid; gap: 14px; }
    .score-card { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; background: var(--line); }
    .score-item { min-height: 95px; padding: 18px; background: var(--surface); }
    .metric-label { color: var(--muted); font: 700 10px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; }
    .metric-value { display: block; margin-top: 10px; font-size: 27px; font-weight: 900; font-variant-numeric: tabular-nums; }
    .info-card { padding: 18px; }
    .info-card h2 { margin: 0 0 10px; font-size: 16px; }
    .info-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .difficulty-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 15px; }
    .difficulty-button { min-height: 34px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: transparent; font-size: 12px; cursor: pointer; }
    .difficulty-button.active { border-color: rgba(200, 255, 95, .62); color: #10160e; background: var(--lime); font-weight: 800; }
    .control-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
    .direction-button { min-height: 42px; border: 1px solid rgba(200, 255, 95, .35); border-radius: 5px; color: var(--ink); background: transparent; font-size: 18px; }
    .direction-button[data-direction="up"] { grid-column: 2; }
    .direction-button[data-direction="left"] { grid-column: 1; grid-row: 2; }
    .direction-button[data-direction="down"] { grid-column: 2; grid-row: 2; }
    .direction-button[data-direction="right"] { grid-column: 3; grid-row: 2; }
    .direction-button:active { transform: scale(.95); background: rgba(200, 255, 95, .15); }
    .secondary-button { width: 100%; min-height: 40px; margin-top: 14px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); background: transparent; font-size: 12px; cursor: pointer; }
    .secondary-button:hover { color: var(--ink); border-color: rgba(244, 243, 238, .35); }
    footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; padding: 23px 0 32px; color: var(--muted); font-size: 12px; }

    @media (max-width: 760px) {
      .app { width: min(100% - 28px, 520px); }
      .topbar { min-height: 64px; }
      .status { display: none; }
      main { padding-top: 45px; }
      .intro { display: block; }
      .intro-copy { max-width: 450px; margin-top: 15px; }
      h1 { font-size: 34px; }
      .game-layout { grid-template-columns: 1fr; }
      .board-panel { padding: 12px; }
      .info-card { padding: 16px; }
    }

    @media (max-width: 430px) {
      .app { width: min(100% - 20px, 380px); }
      .brand { font-size: 13px; }
      h1 { font-size: 30px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="返回小游戏大合集">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        小游戏大合集
      </a>
      <div class="top-actions">
        <span class="status">ARCADE / 003</span>
        <a class="back-link" href="../../">返回游戏厅</a>
      </div>
    </header>

    <main aria-labelledby="page-title">
      <section class="intro">
        <div>
          <p class="eyebrow">SINGLE PLAYER / 003</p>
          <h1 id="page-title">贪吃蛇</h1>
        </div>
        <p class="intro-copy">吃掉能量点，保持方向，看看这条蛇能延伸到多长。</p>
      </section>

      <section class="game-layout" aria-label="贪吃蛇游戏区域">
        <section class="board-panel">
          <div class="board-head"><span class="board-label">GRID RUNNER</span><span class="board-state" id="boardState">准备开始</span></div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="gameCanvas" width="400" height="400" aria-label="贪吃蛇游戏区域"></canvas>
            <div class="board-overlay" id="boardOverlay">
              <div class="overlay-card">
                <h2 id="overlayTitle">贪吃蛇</h2>
                <p id="overlayCopy">吃掉能量点，穿过边界继续前进，同时避开自己的身体。</p>
                <button class="primary-button" id="primaryButton" type="button">开始游戏</button>
              </div>
            </div>
          </div>
        </section>

        <aside class="side-stack">
          <section class="score-card" aria-label="得分记录">
            <div class="score-item"><span class="metric-label">SCORE / 得分</span><strong class="metric-value" id="scoreValue">0</strong></div>
            <div class="score-item"><span class="metric-label">BEST / 最佳</span><strong class="metric-value" id="bestValue">0</strong></div>
          </section>
          <section class="info-card">
            <h2>方向控制</h2>
            <p>电脑使用方向键或 WASD，手机可以在棋盘上滑动，也可以点击按钮。穿过任意边界后，会从另一侧出现。</p>
            <div class="difficulty-picker" role="group" aria-label="贪吃蛇难度">
              <button class="difficulty-button" type="button" data-difficulty="low">低速</button>
              <button class="difficulty-button active" type="button" data-difficulty="normal">中速</button>
              <button class="difficulty-button" type="button" data-difficulty="high">高速</button>
            </div>
            <div class="control-grid" aria-label="方向控制">
              <button class="direction-button" type="button" data-direction="up" aria-label="向上">↑</button>
              <button class="direction-button" type="button" data-direction="left" aria-label="向左">←</button>
              <button class="direction-button" type="button" data-direction="down" aria-label="向下">↓</button>
              <button class="direction-button" type="button" data-direction="right" aria-label="向右">→</button>
            </div>
            <button class="secondary-button" id="resetButton" type="button">重新开始</button>
          </section>
          <section class="desktop-game-leaderboard" data-game-leaderboard="snake" data-game-title="贪吃蛇" data-game-difficulty="normal" aria-label="贪吃蛇排行榜"></section>
        </aside>
      </section>
    </main>
  </div>

  <footer><div class="app footer-inner"><span>ARCADE / 003</span><span>BUILT FOR PLAY</span></div></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/supabase-client.js"></script>
  <script src="../../assets/game-leaderboard.js"></script>
  <script>
    (() => {
      "use strict";

      const SIZE = 20;
      const CELL = 20;
      const STORAGE_PREFIX = "snake-best-";
      const SPEEDS = { low: 170, normal: 120, high: 78 };
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const ui = {
        state: document.getElementById("boardState"),
        score: document.getElementById("scoreValue"),
        best: document.getElementById("bestValue"),
        wrap: document.getElementById("canvasWrap"),
        overlay: document.getElementById("boardOverlay"),
        title: document.getElementById("overlayTitle"),
        copy: document.getElementById("overlayCopy"),
        primary: document.getElementById("primaryButton")
      };
      const directions = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 }
      };
      let snake = [];
      let direction = directions.right;
      let nextDirection = directions.right;
      let food = { x: 14, y: 10 };
      let score = 0;
      let difficulty = "normal";
      let best = readBest();
      let timer = null;
      let playing = false;
      let swipeStart = null;

      function bestKey() { return `${STORAGE_PREFIX}${difficulty}`; }

      function readBest() {
        try { return Math.max(0, Number(window.localStorage.getItem(bestKey())) || 0); } catch (_error) { return 0; }
      }

      function saveBest() {
        try { window.localStorage.setItem(bestKey(), String(best)); } catch (_error) { /* local record is optional */ }
      }

      async function syncScoreToLeaderboard(value) {
        const authClient = window.gameAuth && window.gameAuth.client;
        if (!authClient || value <= 0) return;
        const { data: sessionData } = await authClient.auth.getSession();
        if (!sessionData.session) return;
        const { error } = await authClient.rpc("submit_score", {
          p_game_slug: "snake",
          p_difficulty: difficulty,
          p_score: Math.floor(value)
        });
        if (error) console.warn("Leaderboard sync failed:", error.message);
        else window.gameLeaderboard?.refresh();
      }

      function startGame() {
        window.clearInterval(timer);
        snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
        direction = directions.right;
        nextDirection = directions.right;
        score = 0;
        playing = true;
        ui.overlay.hidden = true;
        ui.state.textContent = "进行中";
        spawnFood();
        render();
        timer = window.setInterval(tick, SPEEDS[difficulty]);
      }

      function spawnFood() {
        const available = [];
        for (let y = 0; y < SIZE; y += 1) {
          for (let x = 0; x < SIZE; x += 1) {
            if (!snake.some(part => part.x === x && part.y === y)) available.push({ x, y });
          }
        }
        food = available[Math.floor(Math.random() * available.length)] || { x: 1, y: 1 };
      }

      function setDirection(next) {
        const candidate = directions[next];
        if (!candidate || candidate.x + direction.x === 0 && candidate.y + direction.y === 0) return;
        nextDirection = candidate;
      }

      function tick() {
        direction = nextDirection;
        const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
        if (head.x < 0) head.x = SIZE - 1;
        if (head.x >= SIZE) head.x = 0;
        if (head.y < 0) head.y = SIZE - 1;
        if (head.y >= SIZE) head.y = 0;
        const ate = head.x === food.x && head.y === food.y;
        const hitsSelf = snake.some((part, index) => part.x === head.x && part.y === head.y && (ate || index < snake.length - 1));
        if (hitsSelf) {
          endGame();
          return;
        }
        snake.unshift(head);
        if (ate) {
          score += 1;
          best = Math.max(best, score);
          saveBest();
          spawnFood();
          window.clearInterval(timer);
          timer = window.setInterval(tick, SPEEDS[difficulty]);
        } else {
          snake.pop();
        }
        render();
      }

      function endGame() {
        playing = false;
        window.clearInterval(timer);
        ui.state.textContent = "本局结束";
        ui.title.textContent = "撞到啦";
        ui.copy.textContent = `本局吃到 ${score} 个能量点，继续挑战你的记录。`;
        ui.primary.textContent = "再来一局";
        ui.overlay.hidden = false;
        void syncScoreToLeaderboard(score);
        render();
      }

      function drawRoundedCell(x, y, size, color, radius) {
        const px = x * CELL + 2;
        const py = y * CELL + 2;
        const width = size * CELL - 4;
        ctx.beginPath();
        ctx.roundRect(px, py, width, width, radius);
        ctx.fillStyle = color;
        ctx.fill();
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#071315";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "rgba(88, 213, 232, .075)";
        ctx.lineWidth = 1;
        for (let i = 1; i < SIZE; i += 1) {
          ctx.beginPath(); ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i * CELL + .5); ctx.lineTo(canvas.width, i * CELL + .5); ctx.stroke();
        }
        ctx.shadowColor = "rgba(255, 128, 114, .65)";
        ctx.shadowBlur = 18;
        drawRoundedCell(food.x, food.y, 1, "#ff8072", 5);
        ctx.shadowBlur = 0;
        snake.forEach((part, index) => {
          const color = index === 0 ? "#c8ff5f" : index % 2 ? "#58d5e8" : "#3dabbc";
          drawRoundedCell(part.x, part.y, 1, color, 5);
        });
        if (snake.length) {
          const head = snake[0];
          ctx.fillStyle = "#102026";
          const eyeX = head.x * CELL + (direction.x < 0 ? 6 : direction.x > 0 ? 14 : 7);
          const eyeY = head.y * CELL + (direction.y < 0 ? 6 : direction.y > 0 ? 14 : 7);
          ctx.fillRect(eyeX, eyeY, 3, 3);
          if (direction.y === 0) ctx.fillRect(head.x * CELL + (direction.x < 0 ? 6 : 14), head.y * CELL + 13, 3, 3);
          else ctx.fillRect(head.x * CELL + 13, head.y * CELL + (direction.y < 0 ? 6 : 14), 3, 3);
        }
        ui.score.textContent = String(score);
        ui.best.textContent = String(best);
      }

      function handleKey(event) {
        const map = { arrowup: "up", w: "up", arrowdown: "down", s: "down", arrowleft: "left", a: "left", arrowright: "right", d: "right" };
        const next = map[event.key.toLowerCase()];
        if (!next) return;
        event.preventDefault();
        setDirection(next);
      }

      document.addEventListener("keydown", handleKey, { passive: false });
      document.querySelectorAll("[data-direction]").forEach(button => button.addEventListener("click", () => setDirection(button.dataset.direction)));
      document.querySelectorAll("[data-difficulty]").forEach(button => button.addEventListener("click", () => {
        difficulty = button.dataset.difficulty;
        best = readBest();
        const leaderboard = document.querySelector('[data-game-leaderboard="snake"]');
        if (leaderboard) leaderboard.dataset.gameDifficulty = difficulty;
        window.gameLeaderboard?.refresh();
        document.querySelectorAll("[data-difficulty]").forEach(item => item.classList.toggle("active", item === button));
        startGame();
      }));
      ui.primary.addEventListener("click", startGame);
      document.getElementById("resetButton").addEventListener("click", startGame);
      ui.wrap.addEventListener("pointerdown", event => {
        if (event.pointerType !== "mouse") {
          swipeStart = { x: event.clientX, y: event.clientY };
          ui.wrap.setPointerCapture(event.pointerId);
        }
      });
      ui.wrap.addEventListener("pointerup", event => {
        if (!swipeStart) return;
        const dx = event.clientX - swipeStart.x;
        const dy = event.clientY - swipeStart.y;
        swipeStart = null;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
        setDirection(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      });
      ui.wrap.addEventListener("pointercancel", () => { swipeStart = null; });

      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      render();
    })();
  </script>
</body>
</html>
