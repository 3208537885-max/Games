<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="Human Benchmark 风格的反应速度测试。">
  <title>反应速度 · HUMAN BENCHMARK</title>
  <style>
    :root {
      --ink: #f4f3ee;
      --muted: #a9b0bc;
      --canvas: #0b1118;
      --surface: #141c25;
      --line: rgba(244, 243, 238, .14);
      --lime: #c8ff5f;
      --cyan: #58d5e8;
      --coral: #ff8072;
      --amber: #ffc763;
      --ready-ink: #10170e;
    }

    * { box-sizing: border-box; }
    html { background: var(--canvas); }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--canvas);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }
    .app { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; min-height: 76px; border-bottom: 1px solid var(--line); }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 800; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 8px); gap: 2px; width: 18px; height: 18px; }
    .brand-mark span { background: var(--lime); }
    .brand-mark span:nth-child(2), .brand-mark span:nth-child(3) { background: var(--cyan); }
    .top-actions { display: flex; align-items: center; gap: 14px; }
    .status-pill, .back-link { color: var(--muted); font-size: 12px; }
    .back-link { display: inline-flex; align-items: center; gap: 7px; }
    .back-link::before { content: "←"; color: var(--lime); font-size: 16px; }
    .main { padding: 70px 0 76px; }
    .intro { display: grid; grid-template-columns: minmax(0, 1fr) 260px; align-items: end; gap: 28px; margin-bottom: 33px; }
    .eyebrow { margin: 0 0 14px; color: var(--lime); font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .1em; }
    h1 { max-width: 680px; margin: 0; font-size: 44px; line-height: 1; font-weight: 820; }
    .intro-copy { margin: 0 0 3px; color: var(--muted); font-size: 14px; line-height: 1.65; }

    .test-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .test-panel-head { display: flex; align-items: center; justify-content: space-between; min-height: 54px; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .panel-title { font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .panel-id { color: var(--muted); font: 600 11px ui-monospace, SFMono-Regular, Consolas, monospace; }
    .reaction-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 430px;
      padding: 36px;
      overflow: hidden;
      border: 0;
      color: var(--ink);
      background-color: #17212b;
      background-image: linear-gradient(rgba(244, 243, 238, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(244, 243, 238, .045) 1px, transparent 1px);
      background-size: 34px 34px;
      cursor: pointer;
      transition: color .18s ease, background-color .18s ease, transform .12s ease;
    }
    .reaction-stage::before { content: ""; position: absolute; inset: 24px; border: 1px solid rgba(244, 243, 238, .13); pointer-events: none; }
    .reaction-stage:hover { background-color: #1b2833; }
    .reaction-stage:active { transform: scale(.998); }
    .reaction-stage:focus-visible { outline: 2px solid var(--lime); outline-offset: -4px; }
    .reaction-stage[data-state="waiting"] { color: var(--ready-ink); background-color: var(--amber); background-image: none; cursor: wait; }
    .reaction-stage[data-state="waiting"]::before { border-color: rgba(16, 23, 14, .23); }
    .reaction-stage[data-state="ready"] { color: var(--ready-ink); background-color: var(--lime); background-image: none; }
    .reaction-stage[data-state="ready"]::before { border-color: rgba(16, 23, 14, .25); }
    .reaction-stage[data-state="early"] { background-color: var(--coral); background-image: none; }
    .reaction-stage[data-state="early"]::before { border-color: rgba(48, 12, 12, .25); }
    .stage-content { position: relative; z-index: 1; display: grid; justify-items: center; gap: 12px; max-width: 520px; text-align: center; }
    .stage-kicker { font: 700 11px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .16em; text-transform: uppercase; }
    .stage-title { font-size: 42px; line-height: 1.05; font-weight: 820; }
    .stage-hint { max-width: 350px; font-size: 14px; line-height: 1.55; opacity: .78; }
    .test-panel-footer { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
    .stat { min-height: 92px; padding: 17px 18px; border-right: 1px solid var(--line); }
    .stat:last-child { border-right: 0; }
    .stat-label { color: var(--muted); font: 600 10px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 9px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .history { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .history-card { min-height: 130px; padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: rgba(20, 28, 37, .72); }
    .history-card h2 { margin: 0 0 7px; font-size: 16px; }
    .history-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .history-card strong { color: var(--cyan); }
    footer { border-top: 1px solid var(--line); }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; padding: 23px 0 32px; color: var(--muted); font-size: 12px; }

    @media (max-width: 760px) {
      .app { width: min(100% - 28px, 620px); }
      .topbar { min-height: 64px; }
      .status-pill { display: none; }
      .main { padding-top: 50px; }
      .intro { grid-template-columns: 1fr; gap: 18px; margin-bottom: 25px; }
      h1 { font-size: 34px; }
      .intro-copy { max-width: 470px; }
      .reaction-stage { min-height: 360px; padding: 26px; }
      .stage-title { font-size: 32px; }
    }

    @media (max-width: 480px) {
      .brand { font-size: 13px; }
      .brand-mark { width: 16px; height: 16px; grid-template-columns: repeat(2, 7px); }
      h1 { font-size: 29px; }
      .reaction-stage { min-height: 330px; }
      .stage-title { font-size: 28px; }
      .stage-hint { font-size: 13px; }
      .test-panel-footer { grid-template-columns: 1fr; }
      .stat { min-height: 70px; border-right: 0; border-bottom: 1px solid var(--line); }
      .stat:last-child { border-bottom: 0; }
      .history { grid-template-columns: 1fr; }
      .footer-inner { flex-direction: column; gap: 7px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="返回不会文科的小旺柴的游戏厅">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        不会文科的小旺柴的游戏厅
      </a>
      <div class="top-actions">
        <span class="status-pill">HUMAN BENCHMARK</span>
        <a class="back-link" href="../../">返回游戏厅</a>
      </div>
    </header>

    <section class="main" aria-labelledby="page-title">
      <div class="intro">
        <div>
          <p class="eyebrow">HUMAN BENCHMARK / 001</p>
          <h1 id="page-title">反应速度测试</h1>
        </div>
        <p class="intro-copy">等屏幕变绿，看到信号后立即点击。你的成绩越低越快。</p>
      </div>

      <section class="test-panel" aria-labelledby="test-title">
        <div class="test-panel-head">
          <span class="panel-title" id="test-title">Reaction time</span>
          <span class="panel-id">TEST / 001</span>
        </div>
        <button class="reaction-stage" id="reactionStage" data-state="idle" type="button" aria-label="开始反应速度测试">
          <span class="stage-content">
            <span class="stage-kicker" id="stageKicker">READY WHEN YOU ARE</span>
            <strong class="stage-title" id="stageTitle">点击开始</strong>
            <span class="stage-hint" id="stageHint">测试会在随机时间后变绿，尽可能快地点击。</span>
          </span>
        </button>
        <div class="test-panel-footer">
          <div class="stat"><span class="stat-label">Best / 最佳</span><strong class="stat-value" id="bestValue">--</strong></div>
          <div class="stat"><span class="stat-label">Last / 最近</span><strong class="stat-value" id="lastValue">--</strong></div>
          <div class="stat"><span class="stat-label">Attempts / 次数</span><strong class="stat-value" id="attemptValue">0</strong></div>
        </div>
      </section>

      <section class="history" aria-label="测试记录摘要">
        <article class="history-card">
          <h2>保持稳定</h2>
          <p>前几次成绩会保存在本机。刷新页面不会丢失你的最佳记录。</p>
        </article>
        <article class="history-card">
          <h2>你的平均成绩</h2>
          <p id="averageText">完成一次测试后，这里会显示平均反应时间。</p>
        </article>
      </section>
    </section>
  </main>

  <footer>
    <div class="app footer-inner">
      <span>HUMAN BENCHMARK / 001</span>
      <span>BUILT FOR PLAY</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../assets/supabase-client.js"></script>
  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "reaction-history";
      const authClient = window.gameAuth && window.gameAuth.client;
      const stage = document.getElementById("reactionStage");
      const ui = {
        kicker: document.getElementById("stageKicker"),
        title: document.getElementById("stageTitle"),
        hint: document.getElementById("stageHint"),
        best: document.getElementById("bestValue"),
        last: document.getElementById("lastValue"),
        attempts: document.getElementById("attemptValue"),
        average: document.getElementById("averageText")
      };
      let phase = "idle";
      let timer = null;
      let readyAt = 0;
      let history = readHistory();

      function readHistory() {
        try {
          const parsed = JSON.parse(window.localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed.filter(value => Number.isFinite(value) && value > 0).slice(-20) : [];
        } catch (_error) {
          return [];
        }
      }

      function saveHistory() {
        try {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        } catch (_error) {
          // The test still works when storage is unavailable.
        }
      }

      async function syncScoreToLeaderboard(value) {
        if (!authClient || value <= 0) return;
        const { data: sessionData } = await authClient.auth.getSession();
        if (!sessionData.session) return;
        const { error } = await authClient.rpc("submit_score", {
          p_game_slug: "reaction",
          p_difficulty: "normal",
          p_score: Math.round(value)
        });
        if (error) console.warn("Leaderboard sync failed:", error.message);
      }

      function formatMs(value) {
        return value ? `${Math.round(value)} ms` : "--";
      }

      function renderStats(last = history[history.length - 1]) {
        const best = history.length ? Math.min(...history) : 0;
        const average = history.length ? Math.round(history.reduce((sum, value) => sum + value, 0) / history.length) : 0;
        ui.best.textContent = formatMs(best);
        ui.last.textContent = formatMs(last);
        ui.attempts.textContent = String(history.length);
        ui.average.innerHTML = average ? `最近 ${history.length} 次的平均反应时间是 <strong>${average} ms</strong>。` : "完成一次测试后，这里会显示平均反应时间。";
      }

      function setPhase(nextPhase) {
        phase = nextPhase;
        stage.dataset.state = phase;
        stage.setAttribute("aria-label", phase === "ready" ? "现在点击" : "开始反应速度测试");
        const copy = {
          idle: ["READY WHEN YOU ARE", "点击开始", "测试会在随机时间后变绿，尽可能快地点击。"],
          waiting: ["WAIT FOR GREEN", "等待变绿...", "现在不要点击。"],
          ready: ["CLICK NOW", "现在点击！", "抓住这一刻。"],
          early: ["TOO SOON", "太早了", "你提前点击了，再来一次。"],
          result: ["RESULT", formatMs(history[history.length - 1]), "点击这里开始下一次测试。"]
        }[phase];
        ui.kicker.textContent = copy[0];
        ui.title.textContent = copy[1];
        ui.hint.textContent = copy[2];
      }

      function startTest() {
        window.clearTimeout(timer);
        setPhase("waiting");
        const delay = 1500 + Math.random() * 3500;
        timer = window.setTimeout(() => {
          readyAt = performance.now();
          setPhase("ready");
        }, delay);
      }

      function finishEarly() {
        window.clearTimeout(timer);
        setPhase("early");
      }

      function eventTime(event) {
        const stamp = Number(event && event.timeStamp);
        const origin = Number(performance.timeOrigin);
        if (!Number.isFinite(stamp)) return performance.now();
        return stamp > 1e12 && Number.isFinite(origin) ? stamp - origin : stamp;
      }

      function finishResult(event) {
        const result = Math.max(0, eventTime(event) - readyAt);
        history.push(Math.round(result));
        history = history.slice(-20);
        saveHistory();
        renderStats(result);
        void syncScoreToLeaderboard(result);
        setPhase("result");
      }

      function handleStageInput(event) {
        if (phase === "waiting") finishEarly();
        else if (phase === "ready") finishResult(event);
        else startTest();
      }

      let lastPointerInputAt = 0;
      stage.addEventListener("pointerdown", event => {
        if (!event.isPrimary) return;
        lastPointerInputAt = performance.now();
        handleStageInput(event);
      });
      stage.addEventListener("click", event => {
        if (performance.now() - lastPointerInputAt < 500) return;
        handleStageInput(event);
      });

      window.addEventListener("beforeunload", () => window.clearTimeout(timer));
      renderStats();
    })();
  </script>
</body>
</html>
